version: '3.8'

services:
  cas-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: cas-bridge:1.0
    container_name: cas-bridge
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
      - DEFAULT_TIMEOUT_MS=1000
      - MAX_TIMEOUT_MS=5000
    volumes:
      # Mount for development (optional - comment out for production)
      - ./app:/app/app:ro
      - ./ui:/app/ui:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
